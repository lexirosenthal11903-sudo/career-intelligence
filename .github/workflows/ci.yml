name: CI

# Auto-run the fast, secret-free checks on every push/PR so regressions fail
# HERE, before they ever reach Lexi (set up 2026-06-24; lint + unit-test gates
# added 2026-06-26 once the lint backlog was cleared to green). Scope:
#   - lint (eslint) + typecheck (tsc) + unit tests + production build + MOCK e2e
#   - unit tests run via `node --test` — Node 24 strips the .ts imports natively,
#     so no vitest/test-runner dependency is needed.
#   - NOT the .prod/.live e2e (need real Supabase/Anthropic secrets — later)
# Dummy public env keeps it fully self-contained: no GitHub secrets, £0.

on:
  push:
    branches: [staging, main]
  pull_request:

env:
  NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-ci

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (mock-based)
        run: npx playwright test smoke first-session-arc --project=chromium
